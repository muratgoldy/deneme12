<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Star Princess</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      background: #1a0033;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      height: 100%;
      font-family: 'Comic Sans MS', 'Chalkboard SE', 'Arial Rounded MT Bold', cursive;
      color: #fff;
      overflow: hidden;
      touch-action: none;
    }
    h1 {
      color: #ffb6e1;
      font-size: clamp(1.1rem, 4.5vw, 2rem);
      letter-spacing: 3px;
      text-shadow: 0 0 18px #ff69b4, 0 0 40px #da70d6;
      margin-bottom: 5px;
    }
    #hud {
      display: flex;
      gap: clamp(8px, 3vw, 30px);
      margin-bottom: 6px;
      font-size: clamp(0.65rem, 2.5vw, 1rem);
      letter-spacing: 1px;
    }
    #hud span { color: #ffdd57; text-shadow: 0 0 8px #ffdd57; }
    #canvasWrap {
      position: relative;
      width: min(600px, 98vw);
      aspect-ratio: 6/5;
    }
    canvas {
      border: 2px solid #da70d6;
      box-shadow: 0 0 30px #ff69b44a, 0 0 60px #da70d622;
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 8px;
    }
    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      pointer-events: none;
      border-radius: 8px;
    }
    #overlay h2 {
      font-size: clamp(1.3rem, 5.5vw, 2.6rem);
      letter-spacing: 4px;
      text-shadow: 0 0 30px currentColor;
    }
    #overlay p {
      font-size: clamp(0.75rem, 2.6vw, 1.05rem);
      color: #ffd6f0;
      letter-spacing: 1px;
      text-align: center;
      padding: 0 20px;
    }
    #overlay button {
      pointer-events: all;
      background: linear-gradient(135deg, #ff69b4, #da70d6);
      border: none;
      color: #fff;
      padding: 12px 36px;
      font-family: inherit;
      font-size: clamp(0.9rem, 3.5vw, 1.15rem);
      letter-spacing: 2px;
      cursor: pointer;
      border-radius: 30px;
      box-shadow: 0 0 24px #ff69b488, 0 4px 0 #9b2580;
      transition: all 0.15s;
      text-shadow: 0 1px 3px #00000055;
    }
    #overlay button:hover, #overlay button:active {
      transform: scale(1.07);
      box-shadow: 0 0 36px #ff69b4cc, 0 2px 0 #9b2580;
    }
    /* Touch controls */
    #touch-controls {
      display: none;
      width: min(600px, 98vw);
      margin-top: 10px;
      gap: 10px;
      justify-content: space-between;
      align-items: center;
    }
    .touch-btn {
      background: linear-gradient(135deg, #ff69b433, #da70d633);
      border: 2px solid #ff69b4;
      color: #ffb6e1;
      font-size: 1.7rem;
      border-radius: 16px;
      cursor: pointer;
      user-select: none;
      text-shadow: 0 0 10px #ff69b4;
      box-shadow: 0 0 15px #ff69b433;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s, transform 0.1s;
      -webkit-user-select: none;
    }
    .touch-btn:active, .touch-btn.pressed {
      background: linear-gradient(135deg, #ff69b466, #da70d666);
      transform: scale(0.93);
    }
    #btn-left, #btn-right { width: 90px; height: 72px; }
    #btn-fire {
      flex: 1; height: 72px;
      font-size: 1.1rem;
      letter-spacing: 2px;
      font-family: inherit;
    }
    #controls {
      margin-top: 7px;
      font-size: 0.62rem;
      color: #7755aa;
      letter-spacing: 1px;
    }
    @media (pointer: coarse) {
      #touch-controls { display: flex; }
      #controls { display: none; }
    }
  </style>
</head>
<body>
  <h1>✨ STAR PRINCESS ✨</h1>
  <div id="hud">
    <div>⭐ STARS: <span id="scoreDisplay">0</span></div>
    <div>🌈 ROUND: <span id="levelDisplay">1</span></div>
    <div>HEARTS: <span id="livesDisplay">♥♥♥♥♥</span></div>
  </div>
  <div id="canvasWrap">
    <canvas id="canvas" width="600" height="500"></canvas>
    <div id="overlay">
      <h2 id="overlayTitle" style="color:#ffb6e1">✨ STAR PRINCESS ✨</h2>
      <p id="overlayMsg">Shoot the grumpy space monsters and save the galaxy!</p>
      <button id="overlayBtn" onclick="startGame()">🚀 Let's Play!</button>
    </div>
  </div>
  <div id="touch-controls">
    <button class="touch-btn" id="btn-left">⬅️</button>
    <button class="touch-btn" id="btn-fire">💖 SHOOT 💖</button>
    <button class="touch-btn" id="btn-right">➡️</button>
  </div>
  <div id="controls">ARROW KEYS — Move &nbsp;|&nbsp; SPACE — Shoot &nbsp;|&nbsp; P — Pause</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

// ── Sounds ───────────────────────────────────────────────────────────────────
let audioCtx;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  // iOS requires resume() after a user gesture
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// Unlock audio on first touch/click/key (required on iOS Safari)
function unlockAudio() { getAudio(); }
document.addEventListener('touchstart', unlockAudio, { once: true, passive: true });
document.addEventListener('mousedown',  unlockAudio, { once: true });
document.addEventListener('keydown',    unlockAudio, { once: true });

function beep(freq, dur, type='sine', vol=0.25) {
  try {
    const a = getAudio();
    const osc = a.createOscillator();
    const gain = a.createGain();
    osc.connect(gain); gain.connect(a.destination);
    osc.type = type; osc.frequency.value = freq;
    gain.gain.setValueAtTime(vol, a.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    osc.start(); osc.stop(a.currentTime + dur);
  } catch(e) {}
}
function shootSound() {
  beep(1400, 0.04, 'square', 0.12);
  setTimeout(() => beep(1000, 0.06, 'square', 0.08), 35);
}
function popSound() {
  beep(700,  0.06, 'sine', 0.22);
  setTimeout(() => beep(950,  0.07, 'sine', 0.22), 45);
  setTimeout(() => beep(1300, 0.12, 'sine', 0.22), 90);
}
function hurtSound() {
  beep(200, 0.15, 'sawtooth', 0.2);
  setTimeout(() => beep(150, 0.2, 'sawtooth', 0.15), 100);
}
function winSound() {
  // happy fanfare: two quick arpeggios then a held chord
  const notes = [523,659,784,523,659,784,1047,1319,1047,784,1047,1319];
  notes.forEach((f,i) => setTimeout(() => beep(f, 0.18, 'sine', 0.22), i*70));
  // bass hits underneath
  [131,196,262].forEach((f,i) => setTimeout(() => beep(f,0.22,'triangle',0.15), i*140));
}
function gameOverSound() {
  [400,350,300,250,200].forEach((f,i) => setTimeout(() => beep(f,0.2,'triangle',0.2), i*100));
}


// ── State ────────────────────────────────────────────────────────────────────
let state = 'menu';
let celebrating = false;
let score = 0, lives = 5, level = 1;

// ── Stars / sparkles background ──────────────────────────────────────────────
const STAR_COLORS = ['#ffb6e1','#da70d6','#ffdd57','#b3f0ff','#ffffff','#ff69b4','#c8a0ff'];
const stars = Array.from({length: 140}, () => ({
  x: Math.random() * W,
  y: Math.random() * H,
  r: Math.random() * 2 + 0.3,
  speed: Math.random() * 0.45 + 0.08,
  alpha: Math.random() * 0.7 + 0.3,
  color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
  twinkle: Math.random() * Math.PI * 2
}));

// ── Player ───────────────────────────────────────────────────────────────────
const player = { x: W/2, y: H - 60, w: 40, h: 36, speed: 5,
                  invincible: 0, shootCooldown: 0 };
const bullets = [];
const particles = [];

// ── Enemies ──────────────────────────────────────────────────────────────────
let enemies = [], enemyBullets = [], enemyDir = 1;
const ENEMY_COLS = 9, ENEMY_ROWS = 4;
const ENEMY_W = 34, ENEMY_H = 26, ENEMY_PAD = 16;

// Cute enemy types per row
const ENEMY_TYPES = [
  { color: '#ff69b4', face: 'cat',      bow: true  },   // row 0 – pink kitty
  { color: '#ff3333', face: 'blob',     bow: false },   // row 1 – red blob
  { color: '#ffdd57', face: 'star',     bow: true  },   // row 2 – yellow star buddy
  { color: '#80ffe8', face: 'jelly',    bow: false },   // row 3 – mint jelly
];

function buildEnemies() {
  enemies = [];
  const startX = (W - ENEMY_COLS * (ENEMY_W + ENEMY_PAD)) / 2 + ENEMY_W/2;
  for (let r = 0; r < ENEMY_ROWS; r++) {
    for (let c = 0; c < ENEMY_COLS; c++) {
      const hp = r === 0 ? 3 : 1;
      enemies.push({
        x: startX + c * (ENEMY_W + ENEMY_PAD),
        y: 55 + r * (ENEMY_H + ENEMY_PAD + 4),
        w: ENEMY_W, h: ENEMY_H,
        row: r, alive: true,
        anim: Math.random() * Math.PI * 2,
        hp, maxHp: hp, hitFlash: 0
      });
    }
  }
}

// ── Keys ─────────────────────────────────────────────────────────────────────
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyP' && state === 'playing') state = 'paused';
  else if (e.code === 'KeyP' && state === 'paused') state = 'playing';
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.code] = false);

// ── Touch ─────────────────────────────────────────────────────────────────────
function bindBtn(id, key) {
  const el = document.getElementById(id);
  const press   = e => { e.preventDefault(); keys[key] = true;  el.classList.add('pressed'); };
  const release = e => { e.preventDefault(); keys[key] = false; el.classList.remove('pressed'); };
  el.addEventListener('touchstart',  press,   { passive: false });
  el.addEventListener('touchend',    release, { passive: false });
  el.addEventListener('touchcancel', release, { passive: false });
  el.addEventListener('mousedown',  press);
  el.addEventListener('mouseup',    release);
  el.addEventListener('mouseleave', release);
}
bindBtn('btn-left',  'ArrowLeft');
bindBtn('btn-right', 'ArrowRight');
bindBtn('btn-fire',  'Space');

// ── Helpers ──────────────────────────────────────────────────────────────────
function collide(a, b) {
  return a.x - a.w/2 < b.x + b.w/2 && a.x + a.w/2 > b.x - b.w/2 &&
         a.y - a.h/2 < b.y + b.h/2 && a.y + a.h/2 > b.y - b.h/2;
}

const SPARK_COLORS = ['#ff69b4','#ffdd57','#da70d6','#80ffe8','#ff9de2','#fffb8a','#c8a0ff'];
function spawnParticles(x, y, count=16) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 3.5 + 0.8;
    // mix hearts, stars and circles
    const shape = ['heart','star','circle'][Math.floor(Math.random()*3)];
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 1,
      life: 1,
      decay: Math.random() * 0.035 + 0.018,
      r: Math.random() * 5 + 3,
      color: SPARK_COLORS[Math.floor(Math.random()*SPARK_COLORS.length)],
      shape
    });
  }
}

function updateHUD() {
  document.getElementById('scoreDisplay').textContent = score;
  document.getElementById('levelDisplay').textContent = level;
  const MAX = 5;
  document.getElementById('livesDisplay').textContent =
    '♥'.repeat(Math.max(0,lives)) + '♡'.repeat(Math.max(0, MAX - lives));
}

// ── Draw helpers ─────────────────────────────────────────────────────────────

// Heart shape centered at (x,y), size s
function drawHeart(x, y, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.beginPath();
  ctx.moveTo(0, s * 0.3);
  ctx.bezierCurveTo(-s*0.5, -s*0.2, -s, s*0.1, 0, s);
  ctx.bezierCurveTo(s, s*0.1, s*0.5, -s*0.2, 0, s*0.3);
  ctx.closePath();
  ctx.fill();
  ctx.restore();
}

// Star shape centered at (x,y)
function drawStar5(x, y, r1, r2) {
  ctx.beginPath();
  for (let i = 0; i < 10; i++) {
    const r = i % 2 === 0 ? r1 : r2;
    const a = (i / 10) * Math.PI * 2 - Math.PI / 2;
    i === 0 ? ctx.moveTo(x + Math.cos(a)*r, y + Math.sin(a)*r)
             : ctx.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r);
  }
  ctx.closePath();
}

// Cute rocket (player)
function drawRocket(x, y, w, h) {
  ctx.save();

  // Engine glow
  ctx.shadowColor = '#ff69b4'; ctx.shadowBlur = 22;

  // Flame
  const flicker = Math.sin(tick * 0.4) * 3;
  const grad = ctx.createRadialGradient(x, y+h/2+4, 2, x, y+h/2+8+flicker, 18+flicker);
  grad.addColorStop(0, '#fff');
  grad.addColorStop(0.3, '#ffdd57');
  grad.addColorStop(0.7, '#ff69b4');
  grad.addColorStop(1, 'transparent');
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.ellipse(x, y + h/2 + 4 + flicker/2, w/4, 10 + flicker, 0, 0, Math.PI*2);
  ctx.fill();

  // Body
  ctx.fillStyle = '#ff69b4';
  ctx.beginPath();
  ctx.moveTo(x, y - h/2);
  ctx.bezierCurveTo(x + w/2, y - h/4, x + w/2, y + h/4, x + w/3, y + h/2);
  ctx.lineTo(x - w/3, y + h/2);
  ctx.bezierCurveTo(x - w/2, y + h/4, x - w/2, y - h/4, x, y - h/2);
  ctx.closePath();
  ctx.fill();

  // Highlight stripe
  ctx.fillStyle = '#ffd6f0';
  ctx.beginPath();
  ctx.ellipse(x, y - h/6, w/9, h/3.5, 0, 0, Math.PI*2);
  ctx.fill();

  // Wings
  ctx.fillStyle = '#da70d6';
  ctx.beginPath();
  ctx.moveTo(x + w/3, y + h/4);
  ctx.lineTo(x + w*0.75, y + h/2 + 4);
  ctx.lineTo(x + w/3, y + h/2);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(x - w/3, y + h/4);
  ctx.lineTo(x - w*0.75, y + h/2 + 4);
  ctx.lineTo(x - w/3, y + h/2);
  ctx.closePath();
  ctx.fill();

  // Crown on top
  const ky = y - h/2 - 2;
  ctx.fillStyle = '#ffdd57';
  ctx.shadowColor = '#ffdd57'; ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(x - 9, ky);
  ctx.lineTo(x - 9, ky - 8);
  ctx.lineTo(x - 4, ky - 4);
  ctx.lineTo(x, ky - 10);
  ctx.lineTo(x + 4, ky - 4);
  ctx.lineTo(x + 9, ky - 8);
  ctx.lineTo(x + 9, ky);
  ctx.closePath();
  ctx.fill();
  // Crown gems
  ctx.fillStyle = '#ff69b4';
  ctx.beginPath(); ctx.arc(x - 6, ky - 6, 2, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x, ky - 8, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + 6, ky - 6, 2, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

// Cute enemy drawing
function drawEnemy(e) {
  if (!e.alive) return;
  const type = ENEMY_TYPES[e.row % ENEMY_TYPES.length];
  const t = e.anim + tick * 0.04;
  const bob = Math.sin(t) * 3;
  const { color, face, bow } = type;
  const { x } = e;
  const y = e.y + bob;
  const rw = e.w / 2, rh = e.h / 2;

  ctx.save();
  ctx.shadowColor = color; ctx.shadowBlur = 14;

  if (face === 'cat') {
    // Rounded body
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(x, y, rw, rh, 0, 0, Math.PI*2); ctx.fill();
    // Ears
    ctx.beginPath();
    ctx.moveTo(x - rw*0.5, y - rh*0.6);
    ctx.lineTo(x - rw*0.9, y - rh*1.1);
    ctx.lineTo(x - rw*0.1, y - rh*0.7);
    ctx.closePath(); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(x + rw*0.5, y - rh*0.6);
    ctx.lineTo(x + rw*0.9, y - rh*1.1);
    ctx.lineTo(x + rw*0.1, y - rh*0.7);
    ctx.closePath(); ctx.fill();
    // Inner ear
    ctx.fillStyle = '#ffd6f0';
    ctx.beginPath(); ctx.ellipse(x - rw*0.5, y - rh*0.85, rw*0.18, rh*0.22, 0, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x + rw*0.5, y - rh*0.85, rw*0.18, rh*0.22, 0, 0, Math.PI*2); ctx.fill();
  } else if (face === 'star') {
    ctx.fillStyle = color;
    drawStar5(x, y, rw*1.1, rh*0.5); ctx.fill();
  } else if (face === 'jelly') {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y - rh*0.1, rw*0.95, Math.PI, 0);
    ctx.bezierCurveTo(x+rw*0.95, y+rh*0.7, x+rw*0.6, y+rh*0.4, x+rw*0.3, y+rh*0.8);
    ctx.bezierCurveTo(x+rw*0.1, y+rh*0.5, x-rw*0.1, y+rh*0.5, x-rw*0.3, y+rh*0.8);
    ctx.bezierCurveTo(x-rw*0.6, y+rh*0.4, x-rw*0.95, y+rh*0.7, x-rw*0.95, y-rh*0.1);
    ctx.closePath(); ctx.fill();
  } else {
    // blob
    ctx.fillStyle = color;
    ctx.beginPath(); ctx.ellipse(x, y, rw, rh, 0, 0, Math.PI*2); ctx.fill();
    // antenna
    ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x, y - rh); ctx.lineTo(x, y - rh - 10); ctx.stroke();
    ctx.fillStyle = '#ffdd57';
    ctx.beginPath(); ctx.arc(x, y - rh - 12, 4, 0, Math.PI*2); ctx.fill();
  }

  // Eyes (all types)
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.ellipse(x - rw*0.3, y - rh*0.1, rw*0.22, rh*0.28, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + rw*0.3, y - rh*0.1, rw*0.22, rh*0.28, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';
  ctx.beginPath(); ctx.arc(x - rw*0.28, y - rh*0.1, rw*0.12, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + rw*0.28, y - rh*0.1, rw*0.12, 0, Math.PI*2); ctx.fill();
  // Sparkle in eyes
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(x - rw*0.22, y - rh*0.18, rw*0.05, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + rw*0.34, y - rh*0.18, rw*0.05, 0, Math.PI*2); ctx.fill();
  // Smile
  ctx.strokeStyle = '#55220a'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.arc(x, y + rh*0.15, rw*0.35, 0.15, Math.PI - 0.15);
  ctx.stroke();
  // Rosy cheeks
  ctx.globalAlpha = 0.45;
  ctx.fillStyle = '#ff9de2';
  ctx.beginPath(); ctx.ellipse(x - rw*0.55, y + rh*0.18, rw*0.22, rh*0.15, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(x + rw*0.55, y + rh*0.18, rw*0.22, rh*0.15, 0, 0, Math.PI*2); ctx.fill();
  ctx.globalAlpha = 1;

  // Bow on top (some rows)
  if (bow) {
    ctx.fillStyle = '#ff1493';
    ctx.shadowColor = '#ff1493'; ctx.shadowBlur = 8;
    const bx = x, by = y - rh - (face === 'cat' ? 4 : 2);
    // left wing
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.bezierCurveTo(bx - 8, by - 7, bx - 14, by - 2, bx - 8, by + 5);
    ctx.bezierCurveTo(bx - 4, by + 2, bx, by, bx, by);
    ctx.fill();
    // right wing
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.bezierCurveTo(bx + 8, by - 7, bx + 14, by - 2, bx + 8, by + 5);
    ctx.bezierCurveTo(bx + 4, by + 2, bx, by, bx, by);
    ctx.fill();
    ctx.fillStyle = '#ffdd57';
    ctx.beginPath(); ctx.arc(bx, by, 3, 0, Math.PI*2); ctx.fill();
  }

  // HP hearts above top-row enemies
  if (e.maxHp > 1) {
    const heartY = e.y + bob - rh - (bow ? 20 : 10);
    const spacing = 10;
    const startHx = x - ((e.maxHp - 1) * spacing) / 2;
    for (let i = 0; i < e.maxHp; i++) {
      const hx = startHx + i * spacing;
      ctx.fillStyle = i < e.hp ? '#ff1493' : '#555';
      ctx.shadowColor = i < e.hp ? '#ff69b4' : 'transparent';
      ctx.shadowBlur = i < e.hp ? 6 : 0;
      ctx.font = '9px serif';
      ctx.textAlign = 'center';
      ctx.fillText('♥', hx, heartY);
    }
  }

  // White flash when hit
  if (e.hitFlash > 0) {
    ctx.globalAlpha = e.hitFlash / 10 * 0.7;
    ctx.fillStyle = '#fff';
    ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.ellipse(x, y, rw * 1.1, rh * 1.1, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// Draw a sparkle/heart/star particle
function drawParticle(p) {
  ctx.save();
  ctx.globalAlpha = p.life;
  ctx.fillStyle = p.color;
  ctx.shadowColor = p.color; ctx.shadowBlur = 6;
  if (p.shape === 'heart') {
    ctx.translate(p.x, p.y);
    ctx.scale(p.r * 0.18, p.r * 0.18);
    ctx.beginPath();
    ctx.moveTo(0, 2);
    ctx.bezierCurveTo(-3, -1, -6, 0.5, 0, 6);
    ctx.bezierCurveTo(6, 0.5, 3, -1, 0, 2);
    ctx.closePath();
    ctx.fill();
  } else if (p.shape === 'star') {
    drawStar5(p.x, p.y, p.r, p.r * 0.45); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 0.5, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

// ── Update ───────────────────────────────────────────────────────────────────
let tick = 0;

function update() {
  tick++;

  // Twinkle stars
  for (const s of stars) {
    s.y += s.speed;
    s.twinkle += 0.06;
    if (s.y > H) { s.y = 0; s.x = Math.random() * W; }
  }

  // Celebration confetti shower during level-up
  if (celebrating && tick % 3 === 0) {
    spawnParticles(Math.random() * W, Math.random() * H * 0.65, 5);
  }
  if (celebrating && tick % 18 === 0) {
    spawnParticles(Math.random() * W, Math.random() * H * 0.4, 20);
  }

  if (state !== 'playing') return;

  if (keys['ArrowLeft']  || keys['KeyA']) player.x = Math.max(player.w/2, player.x - player.speed);
  if (keys['ArrowRight'] || keys['KeyD']) player.x = Math.min(W - player.w/2, player.x + player.speed);

  if (player.shootCooldown > 0) player.shootCooldown--;
  if ((keys['Space'] || keys['ArrowUp']) && player.shootCooldown === 0) {
    bullets.push({ x: player.x, y: player.y - player.h/2 - 6, vy: -10, w: 14, h: 14, isHeart: true });
    player.shootCooldown = 16;
    shootSound();
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    bullets[i].y += bullets[i].vy;
    if (bullets[i].y < -20) bullets.splice(i, 1);
  }

  // Enemy movement – slower than original
  const alive = enemies.filter(e => e.alive);
  if (alive.length === 0) { nextLevel(); return; }

  const speed = 0.45 + level * 0.18 + (1 - alive.length / (ENEMY_COLS * ENEMY_ROWS)) * 1.1;
  let hitEdge = false;
  for (const e of alive) {
    e.x += speed * enemyDir;
    if (e.x > W - e.w/2 - 8 || e.x < e.w/2 + 8) hitEdge = true;
  }
  if (hitEdge) {
    enemyDir *= -1;
    const drop = Math.max(6, 16 - level * 1.5);
    for (const e of alive) e.y += drop;
  }

  // Enemy shoot – slower
  const shootRate = Math.max(35, 110 - level * 8);
  if (tick % shootRate === 0 && alive.length > 0) {
    const shooter = alive[Math.floor(Math.random() * alive.length)];
    enemyBullets.push({ x: shooter.x, y: shooter.y + shooter.h/2,
                        w: 10, h: 10, vy: 2.5 + level * 0.22, color: '#ff6600' });
  }

  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    enemyBullets[i].y += enemyBullets[i].vy;
    if (enemyBullets[i].y > H + 20) enemyBullets.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy; p.vy += 0.06; // gentle gravity
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Tick down hit flash on enemies
  for (const e of enemies) if (e.hitFlash > 0) e.hitFlash--;

  // Bullet vs Enemy
  outer: for (let bi = bullets.length - 1; bi >= 0; bi--) {
    for (const e of alive) {
      if (collide(bullets[bi], e)) {
        e.hp--;
        e.hitFlash = 10;
        bullets.splice(bi, 1);
        if (e.hp <= 0) {
          e.alive = false;
          const pts = (ENEMY_ROWS - e.row) * 10 + 5;
          score += pts;
          spawnParticles(e.x, e.y, 20);
          updateHUD();
          popSound();
        } else {
          beep(400, 0.08, 'square', 0.15); // "ouch" hit sound
        }
        continue outer;
      }
    }
  }

  // Enemy reaches player level → instant game over (can't shoot them at this point)
  for (const e of alive) {
    if (e.y + e.h/2 >= player.y - player.h/2) { gameOver(); return; }
  }

  // Enemy bullet vs Player
  if (player.invincible === 0) {
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      if (collide(enemyBullets[i], player)) {
        enemyBullets.splice(i, 1);
        hitPlayer(); break;
      }
    }
  } else {
    player.invincible--;
  }
}

function hitPlayer() {
  if (state !== 'playing') return;
  spawnParticles(player.x, player.y, 18);
  hurtSound();
  lives--;
  updateHUD();
  if (lives <= 0) { gameOver(); return; }
  player.invincible = 140;
}

function nextLevel() {
  level++;
  score += 500;
  updateHUD();
  enemyBullets.length = 0;
  bullets.length = 0;
  buildEnemies();
  enemyDir = 1;
  state = 'paused';
  celebrating = true;
  winSound();
  // Big initial burst from several spots
  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      spawnParticles(Math.random() * W, Math.random() * H * 0.7, 25);
    }, i * 120);
  }
  const msgs = [
    'Amazing! You got 500 bonus stars! ⭐',
    'Superstar! 500 stars bonus! 🌟',
    'You\'re incredible! +500 stars! 💫',
    'Wow wow wow! 500 bonus stars! ✨',
  ];
  const msg = msgs[(level - 2) % msgs.length];
  showOverlay('🎉 LEVEL ' + level + '! 🎉', msg, '✨ Keep Going! ✨', () => {
    hideOverlay();
    celebrating = false;
    state = 'playing';
  });
}

function gameOver() {
  state = 'dead';
  gameOverSound();
  showOverlay('💫 Nice Try! 💫', 'You collected ' + score + ' stars! ⭐', '🚀 Play Again!', startGame);
}

// ── Draw ─────────────────────────────────────────────────────────────────────
function draw() {
  // Gradient background
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#0d001f');
  bg.addColorStop(1, '#1a0033');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Sparkle stars
  for (const s of stars) {
    const a = s.alpha * (0.6 + 0.4 * Math.sin(s.twinkle));
    ctx.globalAlpha = a;
    ctx.fillStyle = s.color;
    ctx.shadowColor = s.color; ctx.shadowBlur = 4;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  // Particles
  for (const p of particles) drawParticle(p);
  ctx.globalAlpha = 1; ctx.shadowBlur = 0;

  if (state === 'menu') return;

  // Player (blink when invincible)
  if (player.invincible === 0 || Math.floor(player.invincible / 6) % 2 === 0) {
    drawRocket(player.x, player.y, player.w, player.h);
  }

  // Enemies
  for (const e of enemies) drawEnemy(e);

  // Player bullets (hearts)
  for (const b of bullets) {
    ctx.save();
    ctx.fillStyle = '#ff1493';
    ctx.shadowColor = '#ff69b4'; ctx.shadowBlur = 14;
    drawHeart(b.x, b.y - b.h/2, 7);
    ctx.restore();
  }

  // Enemy bullets (small sparkle bubbles)
  for (const b of enemyBullets) {
    ctx.save();
    ctx.fillStyle = b.color;
    ctx.shadowColor = b.color; ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.shadowBlur = 0;
    ctx.beginPath(); ctx.arc(b.x - 2, b.y - 2, 1.5, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  // Ground glow line
  ctx.save();
  ctx.strokeStyle = '#da70d655'; ctx.lineWidth = 1.5;
  ctx.shadowColor = '#da70d6'; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.moveTo(0, H - 20); ctx.lineTo(W, H - 20); ctx.stroke();
  ctx.restore();

  // Celebration rainbow border pulse
  if (celebrating) {
    const hue = (tick * 3) % 360;
    ctx.save();
    ctx.strokeStyle = `hsl(${hue},100%,70%)`;
    ctx.lineWidth = 6;
    ctx.shadowColor = `hsl(${hue},100%,70%)`;
    ctx.shadowBlur = 20;
    ctx.strokeRect(3, 3, W - 6, H - 6);
    ctx.restore();
  }

  // Paused banner
  if (state === 'paused' && document.getElementById('overlay').style.display !== 'flex') {
    ctx.fillStyle = 'rgba(10,0,25,0.7)';
    ctx.fillRect(0, H/2 - 42, W, 84);
    ctx.fillStyle = '#ffb6e1';
    ctx.font = 'bold 2rem Comic Sans MS, cursive';
    ctx.textAlign = 'center';
    ctx.shadowColor = '#ff69b4'; ctx.shadowBlur = 20;
    ctx.fillText('⏸ PAUSED ⏸', W/2, H/2 + 12);
    ctx.shadowBlur = 0;
  }
}

// ── Loop ─────────────────────────────────────────────────────────────────────
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// ── Overlay ───────────────────────────────────────────────────────────────────
function showOverlay(title, msg, btnLabel, cb) {
  document.getElementById('overlayTitle').textContent = title;
  document.getElementById('overlayMsg').textContent = msg;
  const btn = document.getElementById('overlayBtn');
  btn.textContent = btnLabel;
  btn.onclick = cb;
  document.getElementById('overlay').style.display = 'flex';
}
function hideOverlay() {
  document.getElementById('overlay').style.display = 'none';
}

function startGame() {
  hideOverlay();
  score = 0; lives = 5; level = 1; tick = 0; celebrating = false;
  bullets.length = 0; enemyBullets.length = 0; particles.length = 0;
  player.x = W/2; player.invincible = 0; player.shootCooldown = 0;
  buildEnemies();
  enemyDir = 1;
  updateHUD();
  state = 'playing';
}

// ── Boot ─────────────────────────────────────────────────────────────────────
state = 'menu';
updateHUD();
loop();
</script>
</body>
